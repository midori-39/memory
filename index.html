<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>動物神経衰弱ゲーム</title>

<style>
    body{
        margin:0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom, #bfefff, #dff7ff);
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        min-height:100vh;
        overflow:hidden;
    }

    h1{
        margin:8px 0;
        color:#0077aa;
        font-size:clamp(20px,4vw,36px);
    }

    #info{
        font-size:clamp(16px,2vw,24px);
        margin-bottom:10px;
        color:#005577;
        background:white;
        padding:8px 18px;
        border-radius:15px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .game-board{
        display:grid;
        grid-template-columns: repeat(5, 1fr);
        gap:10px;
        width:min(90vw, 600px);
        aspect-ratio:5/4;
    }

    .card{
        position:relative;
        width:100%;
        aspect-ratio:1/1;
        transform-style:preserve-3d;
        transition:transform 0.5s;
        cursor:pointer;
    }

    .card.flip{
        transform:rotateY(180deg);
    }

    .card-face{
        position:absolute;
        width:100%;
        height:100%;
        border-radius:15px;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:clamp(22px,4vw,40px);
        backface-visibility:hidden;
        user-select:none;
    }

    .front{
        background:#5ccfff;
        box-shadow:0 4px 10px rgba(0,0,0,0.15);
        color:white;
        font-weight:bold;
    }

    .back{
        background:white;
        transform:rotateY(180deg);
        border:3px solid #8edfff;
    }

    #clearMessage{
        margin-top:10px;
        font-size:clamp(20px,4vw,32px);
        color:#0077aa;
        font-weight:bold;
        display:none;
    }

    button{
        margin-top:10px;
        padding:10px 20px;
        border:none;
        border-radius:15px;
        background:#5ccfff;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.2s;
    }

    button:hover{
        background:#39b8f0;
        transform:scale(1.05);
    }

    #ranking{
        margin-top:14px;
        background:white;
        padding:12px 18px;
        border-radius:16px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
        color:#005577;
        width:min(85vw, 280px);
        text-align:left;
    }

    #ranking h2{
        margin:0 0 8px 0;
        font-size:20px;
        text-align:center;
        color:#0077aa;
    }

    #ranking ol{
        margin:0;
        padding-left:25px;
    }

    #ranking li{
        margin:6px 0;
        font-size:18px;
    }
</style>
</head>

<body>

<h1>🐾 動物 神経衰弱 🐾</h1>

<div id="info">
    ⏱ 秒数: <span id="timer">0</span>
</div>

<div class="game-board" id="board"></div>

<div id="clearMessage">🎉 クリア！ 🎉</div>

<button onclick="startGame()">もう一回</button>

<div id="ranking">
    <h2>🏆 ベストタイム</h2>
    <ol id="rankingList">
        <li>--- 秒</li>
        <li>--- 秒</li>
        <li>--- 秒</li>
    </ol>
</div>

<!-- 正解音 -->
<audio id="successSound" src="jyan.mp3" preload="auto"></audio>

<script>
const animals = [
    "🐶","🐱","🐰","🦊","🐼",
    "🐷","🐵","🐯","🐨","🦁"
];

let cards = [];
let flippedCards = [];
let matched = 0;
let lockBoard = false;
let timer = 0;
let timerInterval;

const board = document.getElementById("board");
const timerDisplay = document.getElementById("timer");
const clearMessage = document.getElementById("clearMessage");
const successSound = document.getElementById("successSound");
const rankingList = document.getElementById("rankingList");

function shuffle(array){
    for(let i = array.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function startTimer(){

    clearInterval(timerInterval);

    timer = 0;
    timerDisplay.textContent = timer;

    timerInterval = setInterval(() => {
        timer++;
        timerDisplay.textContent = timer;
    }, 1000);
}

function startGame(){

    board.innerHTML = "";
    clearMessage.style.display = "none";

    matched = 0;
    flippedCards = [];
    lockBoard = false;

    cards = [...animals, ...animals];
    shuffle(cards);

    cards.forEach(animal => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="card-face front">？</div>
            <div class="card-face back">${animal}</div>
        `;

        card.dataset.animal = animal;

        card.addEventListener("click", flipCard);

        board.appendChild(card);
    });

    startTimer();
}

function flipCard(){

    if(lockBoard) return;
    if(this.classList.contains("flip")) return;

    this.classList.add("flip");
    flippedCards.push(this);

    if(flippedCards.length === 2){
        checkMatch();
    }
}

function checkMatch(){

    const [card1, card2] = flippedCards;

    if(card1.dataset.animal === card2.dataset.animal){

        // 正解音
        successSound.currentTime = 0;
        successSound.play();

        matched++;
        flippedCards = [];

        if(matched === animals.length){

            clearInterval(timerInterval);

            updateRanking(timer);

            setTimeout(() => {
                clearMessage.style.display = "block";
            }, 300);
        }

    }else{

        lockBoard = true;

        setTimeout(() => {

            card1.classList.remove("flip");
            card2.classList.remove("flip");

            flippedCards = [];
            lockBoard = false;

        }, 900);
    }
}

function updateRanking(newTime){

    let rankings = JSON.parse(localStorage.getItem("animalMemoryRanking")) || [];

    rankings.push(newTime);

    rankings.sort((a, b) => a - b);

    rankings = rankings.slice(0, 3);

    localStorage.setItem("animalMemoryRanking", JSON.stringify(rankings));

    displayRanking();
}

function displayRanking(){

    let rankings = JSON.parse(localStorage.getItem("animalMemoryRanking")) || [];

    rankingList.innerHTML = "";

    for(let i = 0; i < 3; i++){

        const li = document.createElement("li");

        if(rankings[i] !== undefined){
            li.textContent = rankings[i] + " 秒";
        }else{
            li.textContent = "--- 秒";
        }

        rankingList.appendChild(li);
    }
}

displayRanking();
startGame();
</script>

</body>
</html>
