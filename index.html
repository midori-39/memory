<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>からだ神経衰弱ゲーム</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 6px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffe6f0, #e0f7ff);
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* タイトル */
h1 {
  margin: 4px 0;
  color: #ff4f8b;
  font-size: clamp(18px, 3vw, 32px);
}

/* タイマー */
#timer {
  font-size: clamp(16px, 2.5vw, 26px);
  font-weight: bold;
  color: #ff2d74;
  margin: 2px 0;
}

/* メッセージ */
#message {
  font-size: clamp(14px, 2vw, 22px);
  color: #ff4f8b;
  font-weight: bold;
  text-align: center;
  min-height: 28px;
}

/* ボタン */
button {
  padding: 6px 14px;
  border: none;
  border-radius: 10px;
  background: #ff4f8b;
  color: white;
  font-size: clamp(12px, 2vw, 16px);
  cursor: pointer;
  margin: 4px 0;
}

button:hover {
  background: #ff2d74;
}

/* ゲーム全体 */
#game {
  width: min(95vw, 900px);
  height: calc(100vh - 150px);

  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;

  align-content: center;
}

/* カード */
.card {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  perspective: 1000px;
  cursor: pointer;
}

.inner {
  width: 100%;
  height: 100%;
  position: absolute;
  transition: transform 0.5s;
  transform-style: preserve-3d;
}

.card.flipped .inner {
  transform: rotateY(180deg);
}

.front,
.back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 14px;

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;

  backface-visibility: hidden;

  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

.front {
  background: white;
  transform: rotateY(180deg);
}

.back {
  background: #ff7fb0;
  color: white;
}

/* 絵文字 */
.emoji {
  font-size: clamp(20px, 3vw, 42px);
}

/* ラベル */
.label {
  margin-top: 2px;
  color: #555;
  font-size: clamp(9px, 1.2vw, 16px);
}

/* スマホ用 */
@media (max-width: 700px) {

  body {
    padding: 4px;
  }

  #game {
    width: 98vw;
    height: calc(100vh - 140px);

    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }

  .emoji {
    font-size: 24px;
  }

  .label {
    font-size: 10px;
  }

  .front,
  .back {
    border-radius: 10px;
  }
}
</style>
</head>

<body>

<h1>🩺 からだ神経衰弱ゲーム</h1>

<div id="timer">⏰ 0 秒</div>

<button onclick="startGame()">
  シャッフルして再スタート
</button>

<div id="message"></div>

<div id="game"></div>

<script>
const organs = [
  { emoji: "👁️", name: "目" },
  { emoji: "🧠", name: "脳" },
  { emoji: "😋", name: "胃" },
  { emoji: "🫀", name: "心臓" },
  { emoji: "🫘", name: "腎臓" },
  { emoji: "🌀", name: "大腸" },
  { emoji: "🍖", name: "肝臓" },
  { emoji: "👃", name: "鼻" },
  { emoji: "✋", name: "手" },
  { emoji: "🦶", name: "足" },
  { emoji: "👂", name: "耳" },
  { emoji: "👄", name: "口" }
];

let cards = [];
let flipped = [];
let lock = false;
let matchedCount = 0;

let seconds = 0;
let timerInterval = null;

/* シャッフル */
function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

/* タイマー開始 */
function startTimer() {

  clearInterval(timerInterval);

  seconds = 0;

  document.getElementById("timer").textContent =
    `⏰ ${seconds} 秒`;

  timerInterval = setInterval(() => {

    seconds++;

    document.getElementById("timer").textContent =
      `⏰ ${seconds} 秒`;

  }, 1000);
}

/* タイマー停止 */
function stopTimer() {
  clearInterval(timerInterval);
}

/* ゲーム開始 */
function startGame() {

  const game = document.getElementById("game");
  const message = document.getElementById("message");

  game.innerHTML = "";
  message.textContent = "";

  matchedCount = 0;
  flipped = [];
  lock = false;

  startTimer();

  cards = shuffle([...organs, ...organs]);

  cards.forEach((item) => {

    const card = document.createElement("div");

    card.className = "card";

    card.dataset.name = item.name;

    card.innerHTML = `
      <div class="inner">

        <div class="front">
          <div class="emoji">${item.emoji}</div>
          <div class="label">${item.name}</div>
        </div>

        <div class="back">
          <div class="emoji">❓</div>
        </div>

      </div>
    `;

    card.addEventListener("click", () => flipCard(card));

    game.appendChild(card);
  });
}

/* カードをめくる */
function flipCard(card) {

  if (
    lock ||
    card.classList.contains("flipped") ||
    flipped.length >= 2
  ) return;

  card.classList.add("flipped");

  flipped.push(card);

  if (flipped.length === 2) {
    checkMatch();
  }
}

/* 一致判定 */
function checkMatch() {

  lock = true;

  const [a, b] = flipped;

  if (a.dataset.name === b.dataset.name) {

    matchedCount++;

    flipped = [];

    lock = false;

    if (matchedCount === organs.length) {

      stopTimer();

      document.getElementById("message").textContent =
        `🎉 全部そろった！タイム：${seconds} 秒`;
    }

  } else {

    setTimeout(() => {

      a.classList.remove("flipped");
      b.classList.remove("flipped");

      flipped = [];

      lock = false;

    }, 800);
  }
}

startGame();
</script>

</body>
</html>
