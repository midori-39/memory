<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>どうぶつ神経衰弱ゲーム</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(180deg,#dff6ff,#bfefff);
  color:#036;
  display:flex;
  flex-direction:column;
  align-items:center;
  height:100vh;
  overflow:hidden;
  padding:6px;
}

/* タイトル */
h1{
  margin:4px 0;
  font-size:clamp(20px,3vw,34px);
  color:#0088cc;
}

/* タイマー */
#timer{
  font-size:clamp(16px,2vw,24px);
  font-weight:bold;
  margin:4px 0;
  color:#006fa6;
}

/* ボタン */
button{
  background:#4fc3f7;
  border:none;
  color:white;
  padding:7px 14px;
  border-radius:10px;
  font-size:clamp(12px,2vw,16px);
  cursor:pointer;
  margin-bottom:6px;
}

button:hover{
  background:#29b6f6;
}

/* メッセージ */
#message{
  height:28px;
  font-size:clamp(14px,2vw,22px);
  font-weight:bold;
  color:#0077aa;
  margin-bottom:4px;
}

/* ゲーム盤 */
#game{
  width:min(92vw,820px);
  height:calc(100vh - 150px);

  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;

  align-content:center;
}

/* カード */
.card{
  aspect-ratio:1/1;
  position:relative;
  perspective:1000px;
  cursor:pointer;
}

/* 内側 */
.inner{
  width:100%;
  height:100%;
  position:absolute;
  transition:transform .45s;
  transform-style:preserve-3d;
}

.card.flipped .inner{
  transform:rotateY(180deg);
}

/* 表裏 */
.front,
.back{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:12px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  backface-visibility:hidden;

  box-shadow:0 2px 6px rgba(0,0,0,.15);
}

/* 表 */
.front{
  background:white;
  transform:rotateY(180deg);
}

/* 裏 */
.back{
  background:#81d4fa;
  color:white;
}

/* 絵文字 */
.emoji{
  font-size:clamp(20px,3vw,40px);
}

/* 名前 */
.label{
  margin-top:2px;
  font-size:clamp(9px,1.2vw,15px);
  color:#555;
}

/* スマホ */
@media(max-width:700px){

  #game{
    width:96vw;
    height:calc(100vh - 145px);

    grid-template-columns:repeat(4,1fr);
    gap:5px;
  }

  .emoji{
    font-size:24px;
  }

  .label{
    font-size:10px;
  }
}
</style>
</head>

<body>

<h1>🐾 どうぶつ神経衰弱</h1>

<div id="timer">⏰ 0 秒</div>

<button onclick="startGame()">
  シャッフルして再スタート
</button>

<div id="message"></div>

<div id="game"></div>

<script>
const animals = [

  { emoji:"🐶", name:"いぬ" },
  { emoji:"🐱", name:"ねこ" },
  { emoji:"🐰", name:"うさぎ" },
  { emoji:"🐻", name:"くま" },
  { emoji:"🦁", name:"ライオン" },

  { emoji:"🐼", name:"パンダ" },
  { emoji:"🦊", name:"きつね" },
  { emoji:"🐵", name:"さる" },
  { emoji:"🐯", name:"とら" },
  { emoji:"🐨", name:"コアラ" }

];

let cards = [];
let flipped = [];
let lock = false;
let matchedCount = 0;

let seconds = 0;
let timerInterval = null;

/* シャッフル */
function shuffle(array){
  return array.sort(() => Math.random() - 0.5);
}

/* タイマー開始 */
function startTimer(){

  clearInterval(timerInterval);

  seconds = 0;

  updateTimer();

  timerInterval = setInterval(() => {

    seconds++;

    updateTimer();

  },1000);
}

/* タイマー表示 */
function updateTimer(){

  document.getElementById("timer").textContent =
    `⏰ ${seconds} 秒`;
}

/* タイマー停止 */
function stopTimer(){
  clearInterval(timerInterval);
}

/* ゲーム開始 */
function startGame(){

  const game = document.getElementById("game");

  game.innerHTML = "";

  document.getElementById("message").textContent = "";

  matchedCount = 0;
  flipped = [];
  lock = false;

  startTimer();

  cards = shuffle([...animals, ...animals]);

  cards.forEach((item) => {

    const card = document.createElement("div");

    card.className = "card";

    card.dataset.name = item.name;

    card.innerHTML = `

      <div class="inner">

        <div class="front">
          <div class="emoji">${item.emoji}</div>
          <div class="label">${item.name}</div>
        </div>

        <div class="back">

        </div>

      </div>
    `;

    card.addEventListener("click", () => flipCard(card));

    game.appendChild(card);
  });
}

/* カードをめくる */
function flipCard(card){

  if(
    lock ||
    card.classList.contains("flipped") ||
    flipped.length >= 2
  ) return;

  card.classList.add("flipped");

  flipped.push(card);

  if(flipped.length === 2){
    checkMatch();
  }
}

/* 一致チェック */
function checkMatch(){

  lock = true;

  const [a,b] = flipped;

  if(a.dataset.name === b.dataset.name){

    matchedCount++;

    flipped = [];

    lock = false;

    if(matchedCount === animals.length){

      stopTimer();

      document.getElementById("message").textContent =
        `🎉 クリア！ ${seconds} 秒`;
    }

  }else{

    setTimeout(() => {

      a.classList.remove("flipped");
      b.classList.remove("flipped");

      flipped = [];

      lock = false;

    },700);
  }
}

startGame();
</script>

</body>
</html>
